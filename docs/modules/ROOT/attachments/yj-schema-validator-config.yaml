---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:uuid:your-schema-id"
title: "Spring Boot Configuration Properties"
description: "Auto-generated schema from configuration metadata"
type: "object"
$defs:
  loggerLevel:
    type: "string"
    enum:
    - "TRACE"
    - "trace"
    - "DEBUG"
    - "debug"
    - "INFO"
    - "info"
    - "WARN"
    - "warn"
    - "ERROR"
    - "error"
    - "FATAL"
    - "fatal"
    - "OFF"
    - "off"
  loggerLevelProp:
    type: "object"
    additionalProperties:
      oneOf:
      - $ref: "#/$defs/loggerLevel"
      - $ref: "#/$defs/loggerLevelProp"
  java.util.Locale:
    type: "string"
    examples:
    - "en"
    - "en_US"
    - "en_GB"
    - "en_CA"
    - "fr"
    - "fr_FR"
    - "fr_CA"
    - "de"
    - "de_DE"
    - "it"
    - "it_IT"
    - "ja"
    - "ja_JP"
    - "ko"
    - "ko_KR"
    - "zh"
    - "zh_CN"
    - "zh_TW"
  java.nio.charset.Charset:
    type: "string"
    examples:
    - "UTF-8"
    - "UTF-16"
    - "UTF-16BE"
    - "UTF-16LE"
    - "ISO-8859-1"
    - "US-ASCII"
  org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties:
    type: "object"
    $anchor: "org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
    properties:
      additional-properties:
        type: "object"
      all-of:
        type: "array"
        items:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      anchor:
        type: "string"
      any-of:
        type: "array"
        items:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      comment:
        type: "string"
      const-value:
        type: "object"
      contains:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      content-encoding:
        type: "string"
      content-media-type:
        type: "string"
      content-schema:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      default-value:
        type: "object"
      dependent-required:
        type: "object"
        additionalProperties:
          type: "object"
      dependent-schemas:
        type: "object"
        additionalProperties:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      deprecated:
        type: "boolean"
      description:
        type: "string"
      else-schema:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      enum-values:
        type: "array"
        items:
          type: "string"
      examples:
        type: "array"
        items:
          type: "string"
      exclusive-maximum:
        type: "number"
      exclusive-minimum:
        type: "number"
      format:
        type: "string"
        enum:
        - "DATE_TIME"
        - "date_time"
        - "TIME"
        - "time"
        - "DATE"
        - "date"
        - "DURATION"
        - "duration"
        - "EMAIL"
        - "email"
        - "IDN_EMAIL"
        - "idn_email"
        - "HOSTNAME"
        - "hostname"
        - "IDN_HOSTNAME"
        - "idn_hostname"
        - "IPV4"
        - "ipv4"
        - "IPV6"
        - "ipv6"
        - "URI"
        - "uri"
        - "URI_REFERENCE"
        - "uri_reference"
        - "IRI"
        - "iri"
        - "IRI_REFERENCE"
        - "iri_reference"
        - "UUID"
        - "uuid"
        - "JSON_POINTER"
        - "json_pointer"
        - "RELATIVE_JSON_POINTER"
        - "relative_json_pointer"
      html-description:
        type: "string"
      if-schema:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      items:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      max-contains:
        type: "integer"
      max-items:
        type: "integer"
      max-length:
        type: "integer"
      max-properties:
        type: "integer"
      maximum:
        type: "number"
      min-contains:
        type: "integer"
      min-items:
        type: "integer"
      min-length:
        type: "integer"
      min-properties:
        type: "integer"
      minimum:
        type: "number"
      multiple-of:
        type: "number"
      not:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      one-of:
        type: "array"
        items:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      pattern:
        type: "string"
      pattern-properties:
        type: "object"
        additionalProperties:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      prefix-items:
        type: "array"
        items:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      properties:
        type: "object"
        additionalProperties:
          type: "object"
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      property-names:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      read-only:
        type: "boolean"
      reference:
        type: "string"
      required-properties:
        type: "array"
        items:
          type: "string"
      then-schema:
        type: "object"
        $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      title:
        type: "string"
      type:
        type: "string"
        enum:
        - "STRING"
        - "string"
        - "NUMBER"
        - "number"
        - "INTEGER"
        - "integer"
        - "BOOLEAN"
        - "boolean"
        - "ARRAY"
        - "array"
        - "OBJECT"
        - "object"
        - "NULL"
        - "null"
      unique-items:
        type: "boolean"
      write-only:
        type: "boolean"
      x-deprecation:
        type: "object"
        $anchor: "org.alexmond.config.json.schema.jsonschemamodel.XDeprecation"
        properties:
          level:
            type: "string"
          reason:
            type: "string"
          replacement:
            type: "string"
          since:
            type: "string"
  org.springframework.boot.autoconfigure.ssl.JksSslBundleProperties:Store:
    type: "object"
    $anchor: "org.springframework.boot.autoconfigure.ssl.JksSslBundleProperties:Store"
    properties:
      location:
        type: "string"
      password:
        type: "string"
      provider:
        type: "string"
      type:
        type: "string"
  org.springframework.boot.autoconfigure.ssl.PemSslBundleProperties:Store:
    type: "object"
    $anchor: "org.springframework.boot.autoconfigure.ssl.PemSslBundleProperties:Store"
    properties:
      certificate:
        type: "string"
      private-key:
        type: "string"
      private-key-password:
        type: "string"
      type:
        type: "string"
      verify-keys:
        type: "boolean"
properties:
  auto-detect:
    type: "boolean"
    description: "Flag to enable path-based schema autodetection via the JSON Schema\
      \ Store catalog. Only consulted when no schema is supplied and none is declared\
      \ in the file. Fails soft: if no catalog pattern matches, validation falls back\
      \ to the \"no schema\" behaviour. @value true"
    default: true
  catalog-url:
    type: "string"
    description: "URL of the JSON Schema Store catalog used for autodetection. A snapshot\
      \ is bundled in the jar and used as a fallback when this URL cannot be fetched.\
      \ Set to empty to skip the live fetch and always use the bundled snapshot."
    default: "https://www.schemastore.org/api/json/catalog.json"
  color:
    type: "boolean"
    description: "Flag to control whether to use colored output in the console. When\
      \ true, validation results will be displayed with ANSI color codes. @value true\
      \ @since 1.0"
    default: true
  compact:
    type: "boolean"
    description: "Flag controlling the shape of the {@code LLM} report. When true,\
      \ emits compact compiler-style diagnostic lines; when false, emits structured\
      \ JSON. Ignored for other report types. @value false"
    default: false
  files:
    type: "array"
    description: "Array of file paths to validate against the schema. Can contain\
      \ both YAML and JSON files. @since 1.0"
    items:
      type: "string"
  http-timeout:
    type: "string"
    description: "HTTP timeout in seconds for fetching remote schemas. @value 10 seconds\
      \ @since 1.0"
    default: "10s"
  ignore-ssl-errors:
    type: "boolean"
    description: "Flag to control whether SSL certificate validation errors should\
      \ be ignored. When true, SSL certificate validation errors will be ignored during\
      \ HTTP requests. @value true @since 1.0"
    default: false
  json-config-schema:
    type: "object"
    $anchor: "org.alexmond.config.json.schema.config.JsonConfigSchemaConfig"
    description: "JSON Schema configuration properties"
    properties:
      additional-exclude-classes:
        type: "array"
        description: "Additional class names to be excluded from schema generation.\
          \ This list can be used to specify custom classes that should be excluded\
          \ beyond the default exclusions. Classes specified here will be combined\
          \ with the default excludeClasses list."
        items:
          type: "string"
      additional-properties:
        type: "array"
        description: "List of additional property paths to include"
        default: "logging"
        items:
          type: "string"
      all-excluded-classes:
        type: "array"
        items:
          type: "string"
      allow-additional-properties:
        type: "boolean"
        description: "Allow additional properties not defined in schema, currently\
          \ not supported by intellij"
        default: true
      description:
        type: "string"
        description: "Schema description"
        default: "Auto-generated schema from configuration metadata"
      enable-anchor-refs:
        type: "boolean"
        description: "Enable JSON Schema anchor references"
        default: false
      enable-definition-refs:
        type: "boolean"
        description: "Enable JSON Schema definition references"
        default: true
      exclude-anchors:
        type: "array"
        description: "List of classes to exclude from anchor generation"
        default: "##default"
        items:
          type: "string"
      exclude-classes:
        type: "array"
        description: "A list of fully qualified class names that should be excluded\
          \ from schema generation. By default, includes ObjectMapper and ClassLoader\
          \ classes to prevent processing of system-level classes that aren't relevant\
          \ to configuration."
        items:
          type: "string"
      json-schema-properties-map:
        type: "object"
        description: "Map of property names or java objects to their type definitions.\
          \ Used to store custom type mappings and property configurations that override\
          \ or extend the default schema generation behavior."
        additionalProperties:
          $ref: "#/$defs/org.alexmond.config.json.schema.jsonschemamodel.JsonSchemaProperties"
      missing-type-log:
        type: "boolean"
        description: "Enable logging for missing type information"
        default: false
      schema-id:
        type: "string"
        description: "Schema identifier urn, or url"
        default: "urn:uuid:your-schema-id"
      schema-spec:
        type: "string"
        description: "JSON Schema specification URL"
        default: "https://json-schema.org/draft/2020-12/schema"
      title:
        type: "string"
        description: "Schema title"
        default: "Spring Boot Configuration Properties"
      use-openapi:
        type: "boolean"
        description: "Enable OpenAPI annotations processing"
        default: true
      use-validation:
        type: "boolean"
        description: "Enable validation annotations processing"
        default: true
  logging:
    type: "object"
    properties:
      charset:
        type: "object"
        properties:
          console:
            $ref: "#/$defs/java.nio.charset.Charset"
            description: "Charset to use for console output."
          file:
            $ref: "#/$defs/java.nio.charset.Charset"
            description: "Charset to use for file output."
      config:
        type: "string"
        description: "Location of the logging configuration file. For instance, `classpath:logback.xml`\
          \ for Logback."
      console:
        type: "object"
        properties:
          enabled:
            type: "boolean"
            description: "Whether to enable console-based logging."
      exception-conversion-word:
        type: "string"
        description: "Conversion word used when logging exceptions."
        default: "%wEx"
      file:
        type: "object"
        properties:
          name:
            type: "string"
            description: "Log file name (for instance, `myapp.log`). Names can be\
              \ an exact location or relative to the current directory."
          path:
            type: "string"
            description: "Location of the log file. For instance, `/var/log`."
      group:
        type: "object"
        description: "Log groups to quickly change multiple loggers at the same time.\
          \ For instance, `logging.group.db=org.hibernate,org.springframework.jdbc`."
        additionalProperties:
          type: "object"
      include-application-group:
        type: "boolean"
        description: "Whether to include the application group in the logs."
        default: true
      include-application-name:
        type: "boolean"
        description: "Whether to include the application name in the logs."
        default: true
      level:
        $ref: "#/$defs/loggerLevelProp"
        description: "Log levels severity mapping. For instance, `logging.level.org.springframework=DEBUG`."
      log4j2:
        type: "object"
        properties:
          config:
            type: "object"
            properties:
              override:
                type: "array"
                description: "Overriding configuration files used to create a composite\
                  \ configuration. Can be prefixed with 'optional:' to only load the\
                  \ override if it exists."
                items:
                  type: "string"
          rollingpolicy:
            type: "object"
            properties:
              cron:
                type: "string"
                description: "Cron expression used when the strategy is 'cron'."
                default: "0 0 0 * * ?"
              file-name-pattern:
                type: "string"
                description: "Pattern for rolled-over log file names."
                default: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
              max-file-size:
                type: "string"
                description: "Maximum log file size."
                default: "10MB"
              max-history:
                type: "integer"
                description: "Maximum number of archive log files to keep."
                default: 7
              strategy:
                type: "string"
                description: "Rolling policy strategy."
                default: "size"
                enum:
                - "SIZE"
                - "size"
                - "TIME"
                - "time"
                - "SIZE_AND_TIME"
                - "size_and_time"
                - "CRON"
                - "cron"
              time-interval:
                type: "integer"
                description: "Time based triggering interval when the strategy is\
                  \ 'time' or 'size-and-time'."
                default: 1
              time-modulate:
                type: "boolean"
                description: "Whether to align the next rollover time to occur at\
                  \ the top of the interval when the strategy is time based."
                default: false
      logback:
        type: "object"
        properties:
          rollingpolicy:
            type: "object"
            properties:
              clean-history-on-start:
                type: "boolean"
                description: "Whether to clean the archive log files on startup."
                default: false
              file-name-pattern:
                type: "string"
                description: "Pattern for rolled-over log file names."
                default: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
              max-file-size:
                type: "string"
                description: "Maximum log file size."
                default: "10MB"
              max-history:
                type: "integer"
                description: "Maximum number of archive log files to keep."
                default: 7
              total-size-cap:
                type: "string"
                description: "Total size of log backups to be kept."
                default: "0B"
      pattern:
        type: "object"
        properties:
          console:
            type: "string"
            description: "Appender pattern for output to the console. Its default\
              \ value varies according to the logging system."
          correlation:
            type: "string"
            description: "Appender pattern for log correlation. Its default value\
              \ varies according to the logging system."
          dateformat:
            type: "string"
            description: "Appender pattern for log date format."
            default: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
          file:
            type: "string"
            description: "Appender pattern for output to a file. Its default value\
              \ varies according to the logging system."
          level:
            type: "string"
            description: "Appender pattern for log level."
            default: "%5p"
      register-shutdown-hook:
        type: "boolean"
        description: "Register a shutdown hook for the logging system when it is initialized.\
          \ Disabled automatically when deployed as a war file."
        default: true
      structured:
        type: "object"
        properties:
          ecs:
            type: "object"
            properties:
              service:
                type: "object"
                properties:
                  environment:
                    type: "string"
                    description: "Structured ECS service environment."
                  name:
                    type: "string"
                    description: "Structured ECS service name (defaults to 'spring.application.name')."
                  node-name:
                    type: "string"
                    description: "Structured ECS service node name."
                  version:
                    type: "string"
                    description: "Structured ECS service version (defaults to 'spring.application.version')."
          format:
            type: "object"
            properties:
              console:
                type: "string"
                description: "Structured logging format for output to the console.\
                  \ Must be either a format id or a fully qualified class name."
                examples:
                - "ecs"
                - "gelf"
                - "logstash"
              file:
                type: "string"
                description: "Structured logging format for output to a file. Must\
                  \ be either a format id or a fully qualified class name."
                examples:
                - "ecs"
                - "gelf"
                - "logstash"
          gelf:
            type: "object"
            properties:
              host:
                type: "string"
                description: "Structured GELF host (defaults to 'spring.application.name')."
              service:
                type: "object"
                properties:
                  version:
                    type: "string"
                    description: "Structured GELF service version (defaults to 'spring.application.version')."
          json:
            type: "object"
            properties:
              add:
                type: "object"
                description: "Additional members that should be added to structured\
                  \ logging JSON"
              context:
                type: "object"
                properties:
                  include:
                    type: "boolean"
                    description: "Whether context data should be included in the JSON."
                  prefix:
                    type: "string"
                    description: "The prefix to use when inserting context data."
              customizer:
                type: "array"
                description: "Fully qualified class names of StructuredLoggingJsonMembersCustomizer\
                  \ implementations"
                items:
                  type: "object"
              exclude:
                type: "array"
                description: "Member paths that should be excluded from structured\
                  \ logging JSON"
                items:
                  type: "string"
              include:
                type: "array"
                description: "Member paths that should be included in structured logging\
                  \ JSON"
                items:
                  type: "string"
              rename:
                type: "object"
                description: "Mapping between member paths and an alternative name\
                  \ that should be used in structured logging JSON"
              stacktrace:
                type: "object"
                properties:
                  include-common-frames:
                    type: "boolean"
                    description: "Whether common frames should be included."
                  include-hashes:
                    type: "boolean"
                    description: "Whether stack trace hashes should be included."
                  max-length:
                    type: "integer"
                    description: "Maximum length to print."
                  max-throwable-depth:
                    type: "integer"
                    description: "Maximum throwable depth to print."
                  printer:
                    type: "string"
                    description: "Name of the printer to use. Can be 'standard', 'logging-system',\
                      \ or the fully-qualified class name of a StackTracePrinter.\
                      \ When not specified 'logging-system' or 'standard' will be\
                      \ used depending if other properties are set."
                    examples:
                    - "standard"
                    - "logging-system"
                  root:
                    type: "string"
                    description: "Root ordering (root first or root last)."
      threshold:
        type: "object"
        properties:
          console:
            $ref: "#/$defs/loggerLevel"
            description: "Log level threshold for console output."
            default: "TRACE"
          file:
            $ref: "#/$defs/loggerLevel"
            description: "Log level threshold for file output."
            default: "TRACE"
  report-file-name:
    type: "string"
    description: "Name of the file to write the validation report to. Only used when\
      \ reportType is not TEXT. @since 1.0"
  report-type:
    type: "string"
    description: "Type of validation report to generate. @value TEXT @since 1.0"
    default: "text"
    enum:
    - "TEXT"
    - "text"
    - "YAML"
    - "yaml"
    - "JSON"
    - "json"
    - "JUNIT"
    - "junit"
    - "SARIF"
    - "sarif"
    - "LLM"
    - "llm"
  schema:
    type: "string"
    description: "Path to the JSON schema in either JSON or YAML file format used\
      \ for validation. Can be either a local file path or URL."
  schema-override:
    type: "boolean"
    description: "Flag to override a schema path specified in the YAML / JSON file.\
      \ If true, uses schemaPath property instead of $schema from YAML. @value false\
      \ @since 1.0"
    default: false
  spring:
    type: "object"
    properties:
      info:
        type: "object"
        $anchor: "org.springframework.boot.autoconfigure.info.ProjectInfoProperties"
        properties:
          build:
            type: "object"
            $anchor: "org.springframework.boot.autoconfigure.info.ProjectInfoProperties:Build"
            properties:
              encoding:
                $ref: "#/$defs/java.nio.charset.Charset"
                description: "File encoding."
                default: "UTF-8"
              location:
                type: "string"
                description: "Location of the generated build-info.properties file."
                default: "classpath:META-INF/build-info.properties"
          git:
            type: "object"
            $anchor: "org.springframework.boot.autoconfigure.info.ProjectInfoProperties:Git"
            properties:
              encoding:
                $ref: "#/$defs/java.nio.charset.Charset"
                description: "File encoding."
                default: "UTF-8"
              location:
                type: "string"
                description: "Location of the generated git.properties file."
                default: "classpath:git.properties"
      jackson:
        type: "object"
        $anchor: "org.springframework.boot.jackson.autoconfigure.JacksonProperties"
        properties:
          cbor:
            type: "object"
            $anchor: "org.springframework.boot.jackson.autoconfigure.JacksonCborProperties"
            properties:
              read:
                type: "object"
                description: "Jackson on/off token reader features that are specific\
                  \ to CBOR."
              write:
                type: "object"
                description: "Jackson on/off token writer features that are specific\
                  \ to CBOR."
          constructor-detector:
            type: "string"
            description: "Strategy to use to auto-detect constructor, and in particular\
              \ behavior with single-argument constructors."
            default: "default"
            enum:
            - "DEFAULT"
            - "default"
            - "USE_PROPERTIES_BASED"
            - "use_properties_based"
            - "USE_DELEGATING"
            - "use_delegating"
            - "EXPLICIT_ONLY"
            - "explicit_only"
          datatype:
            type: "object"
            $anchor: "org.springframework.boot.jackson.autoconfigure.JacksonProperties:Datatype"
            properties:
              datetime:
                type: "object"
                description: "Jackson on/off features for DateTimes."
              enum:
                type: "object"
                description: "Jackson on/off features for enums."
              enum-features:
                type: "object"
              json-node:
                type: "object"
                description: "Jackson on/off features for JsonNodes."
          date-format:
            type: "string"
            description: "Date format string or a fully-qualified date format class\
              \ name. For instance, 'yyyy-MM-dd HH:mm:ss'."
          default-leniency:
            type: "boolean"
            description: "Global default setting (if any) for leniency."
          default-property-inclusion:
            type: "string"
            description: "Controls the inclusion of properties during serialization.\
              \ Configured with one of the values in Jackson's JsonInclude.Include\
              \ enumeration."
            enum:
            - "ALWAYS"
            - "always"
            - "NON_NULL"
            - "non_null"
            - "NON_ABSENT"
            - "non_absent"
            - "NON_EMPTY"
            - "non_empty"
            - "NON_DEFAULT"
            - "non_default"
